# Theme configuration
[project.theme]
variant = "modern"

[project.theme.palette]
scheme = "slate"
primary = "deep purple"
accent = "amber"

[project.theme.features]
navigation_tabs = true
navigation_sections = true
navigation_expand = true
toc_integrate = true
search_suggest = true
search_highlight = true
content_code_copy = true

# Extensions for enhanced markdown
[project.extensions.pymdownx]
highlight = true
superfences = true
tabbed = true
tasklist = true
emoji = true

[project.extensions.toc]
permalink = true

[project.extensions.admonition]
enabled = true
